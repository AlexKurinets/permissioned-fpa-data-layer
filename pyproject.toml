[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "permissioned-fpa-data-layer"
version = "1.0.0"
description = "Permissioned FP&A data layer: semantic layer, row-level access, BvA packages and AI variance drafting."
readme = "README.md"
license = "MIT"
authors = [{ name = "Alex Kurinets" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "python-pptx>=1.0",
    "anthropic>=1,<2",
    "requests>=2.32",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "streamlit>=1.40"]

[project.scripts]
fpa = "fpa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["fpa", "conftest", "common"]

[tool.ruff.lint.per-file-ignores]
"src/fpa/synthetic.py" = ["E501"]  # the synthetic company is defined as wide data tables
