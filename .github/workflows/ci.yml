name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fpa
          POSTGRES_PASSWORD: fpa
          POSTGRES_DB: fpa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fpa -d fpa"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    env:
      FPA_OWNER_DSN: postgresql://fpa:fpa@localhost:5432/fpa
      FPA_APP_DSN: postgresql://fpa_app:fpa_app@localhost:5432/fpa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q --durations=5

  compose:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Bring the stack up
        run: docker compose up --build -d
      - name: Wait for the dashboard
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8501/_stcore/health >/dev/null 2>&1; then
              echo "dashboard up after about $((i * 5))s"; exit 0
            fi
            sleep 5
          done
          docker compose ps; exit 1
      - name: Smoke every documented sequence
        run: bash scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
